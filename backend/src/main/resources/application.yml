server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
  tomcat:
    max-swallow-size: 1MB
    max-http-form-post-size: 64KB

spring:
  application:
    name: civiclens-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/civiclens}
    username: ${DB_USERNAME:civiclens}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} %-5level [%X{traceId:-no-trace}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.civiclens: INFO
    org.hibernate.SQL: WARN

civiclens:
  security:
    # Required. At least 32 characters. Generate e.g. with: [Convert]::ToBase64String((1..48|%{Get-Random -Max 256}))
    jwt-secret: ${JWT_SECRET:}
    jwt-ttl: ${JWT_TTL:PT12H}
    jwt-issuer: civiclens
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    admin-display-name: ${BOOTSTRAP_ADMIN_NAME:System Admin}
  demo:
    seed-enabled: ${DEMO_SEED_ENABLED:false}
    # Password for the seeded demo accounts. Seeding is skipped if this is blank.
    seed-password: ${DEMO_SEED_PASSWORD:}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    window: PT1M
    auth-requests-per-window: 20
    write-requests-per-window: 60
  ai:
    provider: ${AI_PROVIDER:gemini}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.8-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      connect-timeout: PT5S
      request-timeout: ${GEMINI_TIMEOUT:PT20S}
    fallback-enabled: ${AI_FALLBACK_ENABLED:true}
    max-attempts: 3
    retry-backoff: PT20S
    lease-duration: PT2M
    processing-mode: async
    scheduler-enabled: true
    scheduler-interval: PT15S
  duplicates:
    window-days: 90
    max-distance-meters: 300
    candidate-scan-limit: 300
    min-score: 0.35
    strong-match-score: 0.55
    max-results: 5
  workflow:
    aging-threshold-days: 7
    reopen-window-days: 30
